name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Validate (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI Help
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Run pre-release validation
        run: npm run release:check

      - name: Verify package dry-run
        run: npm run pack:dry-run

      - name: Run consumer smoke test
        run: npm run test:package

      - name: Production dependency security audit
        run: npm run audit:prod
